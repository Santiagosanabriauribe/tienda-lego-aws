services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-tienda-lego
    environment:
      POSTGRES_DB: tienda_lego
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
